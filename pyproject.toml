[project]
name = "photo-cat-evo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pint>=0.24",
    "pymupdf>=1.24",
]

[project.scripts]
PhotoCatEvo = "PhotoCatEvo.agent:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PhotoCatEvo"
