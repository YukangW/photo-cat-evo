[project]
name = "photo-cat-evo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "openpyxl>=3.1",
    "periodictable>=1.7",
    "pint>=0.24",
    "pymupdf>=1.24",
    "requests>=2.31",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "python-multipart>=0.0.20", "uvicorn>=0.34"]
ui = ["gradio>=6,<7"]

[project.scripts]
PhotoCatEvo = "PhotoCatEvo.agent:main"
PhotoCatEvo-table = "PhotoCatEvo.organize:main"
PhotoCatEvo-collect = "PhotoCatEvo.collect_papers:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "PhotoCatEvo"
